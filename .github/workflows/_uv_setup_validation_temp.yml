name: Validate locked setup helpers

on:
  push:
    branches:
      - agent/add-clone-all-scripts
    paths:
      - ".github/workflows/_uv_setup_validation_temp.yml"
      - "deploy/setup_all.bat"
      - "deploy/setup_all.sh"
      - "README.md"
      - "docs/deployment.md"

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install pnpm
        run: npm install --global pnpm@11.21.0
      - name: Validate shell syntax
        run: |
          sh -n deploy/clone_all.sh
          sh -n deploy/update_all.sh
          sh -n deploy/setup_all.sh
          sh -n deploy/start_all.sh
      - name: Smoke-test setup helper without cloned apps
        run: sh ./deploy/setup_all.sh

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.21.0
      - name: Smoke-test setup helper without cloned apps
        shell: cmd
        run: call deploy\setup_all.bat
