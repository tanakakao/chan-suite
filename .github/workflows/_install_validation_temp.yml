name: Validate initial installers

on:
  push:
    branches:
      - agent/adopt-uv-lock-suite
    paths:
      - "install.bat"
      - "install.sh"
      - ".github/workflows/_install_validation_temp.yml"

jobs:
  shell-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - run: npm install --global pnpm@11.21.0
      - name: Validate and smoke-test install.sh
        run: |
          sh -n install.sh
          test_dir="$RUNNER_TEMP/chan-install-test"
          mkdir -p "$test_dir/deploy"
          cp install.sh "$test_dir/install.sh"
          printf '#!/usr/bin/env sh\necho clone stub\nexit 0\n' > "$test_dir/deploy/clone_all.sh"
          printf '#!/usr/bin/env sh\necho setup stub\nexit 0\n' > "$test_dir/deploy/setup_all.sh"
          printf '#!/usr/bin/env sh\necho start stub\nexit 0\n' > "$test_dir/deploy/start_all.sh"
          sh "$test_dir/install.sh"
          sh "$test_dir/install.sh" --start

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - shell: pwsh
        run: npm install --global pnpm@11.21.0
      - name: Prepare Windows installer stubs
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'chan-install-test'
          New-Item -ItemType Directory -Force -Path (Join-Path $testDir 'deploy') | Out-Null
          Copy-Item install.bat (Join-Path $testDir 'install.bat')
          '@echo off`necho clone stub`nexit /b 0' | Set-Content -Encoding ascii (Join-Path $testDir 'deploy\clone_all.bat')
          '@echo off`necho setup stub`nexit /b 0' | Set-Content -Encoding ascii (Join-Path $testDir 'deploy\setup_all.bat')
          '@echo off`necho start stub`nexit /b 0' | Set-Content -Encoding ascii (Join-Path $testDir 'deploy\start_all.bat')
      - name: Smoke-test install.bat
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\chan-install-test\install.bat"
          if errorlevel 1 exit /b 1
          call "%RUNNER_TEMP%\chan-install-test\install.bat" --start
          if errorlevel 1 exit /b 1
