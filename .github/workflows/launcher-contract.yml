name: Launcher contract

on:
  pull_request:
    paths:
      - "deploy/start_all.ps1"
      - "deploy/start_all.sh"
      - "tests/test_launcher_contract.py"
      - ".github/workflows/launcher-contract.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/start_all.ps1"
      - "deploy/start_all.sh"
      - "tests/test_launcher_contract.py"
      - ".github/workflows/launcher-contract.yml"

jobs:
  launcher-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate launcher argument contract
        run: python -m unittest discover -s tests -p "test_launcher_contract.py"
      - name: Validate POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n deploy/start_all.sh
      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/start_all.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
