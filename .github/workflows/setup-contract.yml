name: Setup contract

on:
  pull_request:
    paths:
      - "deploy/setup_all.bat"
      - "deploy/setup_all.sh"
      - "tests/test_setup_contract.py"
      - ".github/workflows/setup-contract.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/setup_all.bat"
      - "deploy/setup_all.sh"
      - "tests/test_setup_contract.py"
      - ".github/workflows/setup-contract.yml"

jobs:
  setup-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate setup dependency contract
        run: python -m unittest tests/test_setup_contract.py
      - name: Validate POSIX setup syntax
        if: runner.os != 'Windows'
        run: sh -n deploy/setup_all.sh
