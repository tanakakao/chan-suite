name: Validate Windows wrappers

on:
  push:
    branches:
      - agent/fix-local-start-wrapper

jobs:
  windows-wrappers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.21.0
      - name: Validate Local start wrapper
        shell: cmd
        run: |
          call deploy\start_all.bat > start-local.txt
          type start-local.txt
          findstr /C:"[PROFILE] Local; bind host: 127.0.0.1; public host: 127.0.0.1" start-local.txt
          findstr /C:"Portal : http://127.0.0.1:5172" start-local.txt
      - name: Validate Local status wrapper
        shell: cmd
        run: |
          call deploy\status.bat > status-local.txt
          type status-local.txt
          findstr /C:"Profile    : Local" status-local.txt
          findstr /C:"Public host: 127.0.0.1" status-local.txt
      - name: Validate Intranet wrappers
        shell: cmd
        run: |
          call deploy\start_all.bat Intranet chan-server > start-intranet.txt
          type start-intranet.txt
          findstr /C:"[PROFILE] Intranet; bind host: 0.0.0.0; public host: chan-server" start-intranet.txt
          call deploy\status.bat Intranet chan-server > status-intranet.txt
          type status-intranet.txt
          findstr /C:"Public host: chan-server" status-intranet.txt
