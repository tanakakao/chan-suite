name: Validate suite helper scripts

on:
  push:
    branches:
      - agent/add-clone-all-scripts
    paths:
      - "deploy/**"
      - ".github/workflows/_script-validation-temp.yml"

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX shell syntax
        run: |
          sh -n deploy/clone_all.sh
          sh -n deploy/update_all.sh
          sh -n deploy/setup_all.sh
          sh -n deploy/start_all.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm for setup smoke test
        shell: pwsh
        run: npm install --global pnpm@11.21.0
      - name: Smoke-test update helper with no cloned apps
        shell: cmd
        run: call deploy\update_all.bat
      - name: Smoke-test setup helper with no cloned apps
        shell: cmd
        run: call deploy\setup_all.bat
      - name: Smoke-test start wrapper with no cloned apps
        shell: cmd
        run: call deploy\start_all.bat Local
